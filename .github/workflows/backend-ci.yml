name: CI

on:
  push:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Show container status
        run: docker compose ps -a

      - name: Run Alembic migrations
        run: docker compose run --rm api alembic upgrade head

      - name: Export schema snapshot
        run: docker compose exec -T api python scripts/export_schema.py --output schema_snapshot.json

      - name: Upload schema snapshot
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: schema-snapshot
          path: Backend/schema_snapshot.json
          if-no-files-found: error

      - name: Run tests
        run: docker compose exec -T -e SCHEMA_EXPORT_TEST=1 api pytest -q

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs api --tail=200
          docker compose logs db --tail=200